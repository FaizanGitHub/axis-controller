name: CI

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build and run tests
        run: |
          mkdir -p build
          gcc -Isrc -Itest test/test_cmd_pool.c src/cmd_pool.c test/unity/unity.c -o build/test_cmd_pool
          ./build/test_cmd_pool
          gcc -Isrc -Itest test/test_parser.c test/unity/unity.c -o build/test_parser
          ./build/test_parser
